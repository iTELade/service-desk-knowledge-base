services:
  knowledge-base:
    build:
      context: .
    container_name: itelade-knowledge-base
    restart: unless-stopped
    environment:
      PORT: 8080
      KB_DATA_DIR: /data
      KB_BRAND: iTELade Knowledge Base
      KB_DEFAULT_LANG: en
      KB_SECURE_COOKIE: "true"
    ports:
      - "8080:8080"
    volumes:
      - knowledge-base-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  knowledge-base-data:
