name: Knowledge Base CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check
        run: npm run check
      - name: Docker build
        run: docker build -t itelade-kb:test .
      - name: Container smoke test
        run: |
          docker run -d --name kb-test -p 18080:8080 itelade-kb:test
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs kb-test
          exit 1
